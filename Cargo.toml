[package]
name = "fluen-kb"
version = "0.1.0"
edition = "2024"
description = "Generic knowledge-base SDK: markdown entries with provenance tracking, typed relations, and derived SQLite index."
license = "MIT"

[features]
default = ["index"]
index = ["dep:rusqlite", "dep:uuid", "dep:sha2"]
async = ["dep:tokio", "index"]
mcp-server = ["dep:serde", "dep:serde_json", "dep:rmcp", "dep:tokio", "index"]

[dependencies]
rusqlite = { version = "0.37", optional = true, features = ["bundled"] }
uuid = { version = "1", optional = true, features = ["v4"] }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
rmcp = { version = "3", optional = true, default-features = false, features = ["server", "transport-io"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "io-util"] }
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
rmcp = { version = "3", default-features = false, features = ["client", "transport-async-rw"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
